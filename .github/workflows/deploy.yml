# Merge ke main → aplikasi hidup, tanpa menyentuh laptop siapa pun.
#
# Berkas ini menggantikan deploy ke GitHub Pages. Pages hanya menyajikan berkas
# statis, sementara aplikasi ini butuh proses yang berjalan: Go API, Postgres,
# Redis, dan sidecar Tesseract. Frontend memanggil /api/v1 relatif ke host yang
# sama, jadi di Pages panggilan itu mendarat di domain github.io yang tidak
# punya backend — yang ter-deploy adalah cangkang yang setiap requestnya 404.
#
# Alurnya: image dibangun di runner, didorong ke GitHub Container Registry, lalu
# server hanya menarik dan menyalakan. Membangun di server sengaja dihindari —
# bundling Vite butuh memori yang tidak dimiliki VPS kecil, dan kegagalannya
# muncul sebagai OOM saat deploy, bukan saat build.
#
# Rahasia yang harus diisi di Settings → Secrets and variables → Actions:
#
#   DEPLOY_HOST     alamat IP atau hostname server
#   DEPLOY_USER     user SSH di server
#   DEPLOY_SSH_KEY  private key OpenSSH utuh, termasuk baris BEGIN/END
#   DEPLOY_PATH     lokasi repo di server, mis. /srv/pintour
#   HEALTHCHECK_URL URL publik untuk verifikasi, mis. https://pintour.my.id
#
# .env TIDAK pernah lewat sini. Berkas itu hidup di server saja.

name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Dua deploy yang berjalan bersamaan bisa menyalakan urutan image yang berbeda
# dari yang terakhir di-merge. Yang belakangan menunggu, tidak dibatalkan —
# membatalkan di tengah `docker compose up` meninggalkan stack setengah jalan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}-api
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web

jobs:
  # ── Uji dulu ────────────────────────────────────────────────────────────────
  # Deploy yang tidak menunggu test hanya memindahkan kegagalan dari runner ke
  # produksi.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      # Test kontrak repository dilewati tanpa TEST_DATABASE_URL, jadi Postgres
      # disediakan di sini supaya lapisan data ikut teruji, bukan cuma dilompati.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./... -count=1

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

  # ── Bangun dan dorong image ─────────────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ditandai dengan SHA commit, bukan hanya latest. `latest` tidak bisa
      # menjawab "versi mana yang sedang jalan", dan rollback butuh nama untuk
      # kembali ke sana.
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ── Nyalakan di server ──────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - name: Deploy lewat SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Berkas compose ikut versi yang di-merge; .env tidak, karena tidak
            # pernah ada di repo.
            git fetch --depth 1 origin main
            git reset --hard origin/main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export TAG=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Migrasi tidak dijalankan di sini. API menerapkannya sendiri saat
            # start dan berhenti bila gagal, jadi langkah terpisah di sini hanya
            # akan menjadi sumber kebenaran kedua yang bisa berbeda.

            docker image prune -f --filter "until=168h"

      # Deploy yang dilaporkan hijau padahal aplikasinya mati adalah kegagalan
      # yang paling mahal: tidak ada yang tahu sampai ada yang membuka situsnya.
      - name: Verifikasi aplikasi benar-benar melayani
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "${{ secrets.HEALTHCHECK_URL }}/api/v1/packages" || echo 000)
            echo "percobaan $i: http=$code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Aplikasi tidak menjawab 200 setelah deploy"
          exit 1
