# Deployment utama (PRD §24). Nginx pada service `web` adalah satu-satunya pintu
# masuk: seluruh service lain hanya `expose`, artinya terjangkau dari jaringan
# internal Docker tapi tidak dari luar mesin.
#
# Tidak ada kredensial di berkas ini. Berkas ini terlacak git pada repo publik,
# jadi setiap nilai rahasia di sini sama saja dengan diumumkan. Yang dipakai
# adalah bentuk `${VAR:?pesan}` — compose berhenti dengan pesan itu bila
# variabelnya kosong, alih-alih diam-diam memakai nilai bawaan yang semua orang
# sudah tahu.
#
# Pengembangan lokal butuh port basis data terbuka (psql, test kontrak
# repository). Itu disediakan terpisah:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Produksi cukup `docker compose up -d`, dan tertutup karena itu bawaannya.

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pintour_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pintour_db}
      POSTGRES_USER:     ${POSTGRES_USER:-pintour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di .env — jangan pakai nilai yang pernah ada di repo}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Migrasi TIDAK lagi dipasang ke /docker-entrypoint-initdb.d. Direktori itu
      # hanya dijalankan Postgres saat volume pertama kali dibuat, sehingga
      # deployment yang sudah berisi data tidak pernah menerima migrasi baru —
      # persis cara skema tertinggal di 007 sementara kode menunggu 009.
      # Service `api` yang menerapkannya saat start, setiap kali, dan berhenti
      # bila gagal.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pintour} -d ${POSTGRES_DB:-pintour_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pintour_redis
    restart: unless-stopped
    # Sebelumnya Redis berjalan tanpa autentikasi sama sekali. Selama portnya
    # tertutup itu hanya berarti siapa pun yang sudah masuk ke jaringan Docker
    # bisa membacanya — tapi pertahanan yang bergantung pada satu lapisan saja
    # runtuh seluruhnya begitu lapisan itu keliru dibuka.
    command: >
      redis-server --save 60 1 --loglevel warning
      --requirepass ${REDIS_PASSWORD:?wajib diisi di .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?wajib diisi di .env}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Tesseract OCR sidecar (v2.0 F6: self-hosted, data tidak keluar jaringan) ──
  tesseract-api:
    image: hertzg/tesseract-server:latest
    container_name: pintour_tesseract
    restart: unless-stopped
    expose:
      - "8884"
    healthcheck:
      # 127.0.0.1, bukan localhost — wget di image ini resolve localhost ke
      # ::1 (IPv6) duluan, tapi tesseract-server cuma listen di IPv4 0.0.0.0.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8884/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Go API server (PRD §18: pgx/v5 + gocron + rs/cors + validator) ──────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pintour_api
    restart: unless-stopped
    env_file:
      - .env                                  # rahasia aplikasi dibaca dari sini
    environment:
      # Disusun dari bagian-bagiannya supaya password punya satu sumber. Ditulis
      # utuh di sini dulu, jadi mengganti password berarti mengganti dua tempat
      # dan lupa salah satunya berarti API gagal connect tanpa sebab yang jelas.
      DATABASE_URL: postgres://${POSTGRES_USER:-pintour}:${POSTGRES_PASSWORD:?wajib diisi di .env}@db:5432/${POSTGRES_DB:-pintour_db}?sslmode=disable
      REDIS_ADDR:     redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?wajib diisi di .env}
      # Ditulis harfiah, bukan ${APP_ENV:-production}. Bentuk itu terbaca seolah
      # produksi adalah bawaannya, padahal compose mengambil ${APP_ENV} dari .env
      # — berkas yang sama yang dipakai env_file — sehingga satu baris
      # APP_ENV=development di sana menang, diam-diam, di setiap deployment yang
      # menyalin .env.example apa adanya.
      #
      # Akibatnya bukan sekadar label: Validate() langsung return nil di luar
      # produksi, jadi seluruh pemeriksaan konfigurasi tidak berjalan dan cookie
      # tidak Secure. Diuji pada .env repo ini, produksi menolak start dengan
      # tiga masalah sekaligus — dua URL portal menunjuk localhost, dan
      # MIDTRANS_SERVER_KEY terisi sementara MIDTRANS_ENV masih sandbox.
      # Ketiganya persis yang Validate() dibuat untuk menangkap.
      #
      # Pengembangan lokal menurunkannya lewat docker-compose.dev.yml.
      APP_ENV:        production
      SERVER_PORT:    8080
      OCR_ENGINE:        tesseract_local      # v2.0 F6 — OCR self-hosted
      TESSERACT_API_URL: http://tesseract-api:8884
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Tidak di-publish. Nginx sudah mem-proxy /api/ ke sini; membuka 8080 ke host
    # berarti ada jalan masuk yang melewati nginx — dan melewati TLS di depannya.
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tesseract-api:
        condition: service_started

  # ── React web app (Nginx) — satu-satunya pintu ke luar ───────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pintour_web
    restart: unless-stopped
    ports:
      # Di produksi biarkan terminator TLS (Caddy/nginx host) yang memegang 443
      # dan arahkan ke sini lewat WEB_PORT, alih-alih membuka 80 ke publik.
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data:
  redis_data:
