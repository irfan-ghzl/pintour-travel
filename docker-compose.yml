services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pintour_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pintour_db
      POSTGRES_USER:     pintour
      POSTGRES_PASSWORD: pintour_pass
    volumes:
      - db_data:/var/lib/postgresql/data
      # Auto-apply semua migration saat container pertama kali start.
      # Postgres jalankan file di /docker-entrypoint-initdb.d/ urut nama.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pintour -d pintour_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s    # beri waktu init script (apply migration 001-005) selesai

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pintour_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Tesseract OCR sidecar (v2.0 F6: self-hosted, data tidak keluar jaringan) ──
  tesseract-api:
    image: hertzg/tesseract-server:latest
    container_name: pintour_tesseract
    restart: unless-stopped
    # Tidak expose port ke host — hanya diakses dari service `api` lewat jaringan internal.
    expose:
      - "8884"
    healthcheck:
      # 127.0.0.1, bukan localhost — wget di image ini resolve localhost ke
      # ::1 (IPv6) duluan, tapi tesseract-server cuma listen di IPv4 0.0.0.0.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8884/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Go API server (PRD §18: pgx/v5 + gocron + rs/cors + validator) ──────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pintour_api
    restart: unless-stopped
    env_file:
      - .env                                  # baca semua env dari .env
    environment:
      # Override yang khusus untuk container (host db & redis berbeda dengan localhost)
      DATABASE_URL:    postgres://pintour:pintour_pass@db:5432/pintour_db?sslmode=disable
      REDIS_ADDR:      redis:6379
      APP_ENV:         ${APP_ENV:-production} # default production di container
      SERVER_PORT:     8080
      OCR_ENGINE:        tesseract_local      # v2.0 F6 — OCR self-hosted
      TESSERACT_API_URL: http://tesseract-api:8884
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tesseract-api:
        condition: service_started

  # ── React web app (Nginx) ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pintour_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data:
  redis_data:
