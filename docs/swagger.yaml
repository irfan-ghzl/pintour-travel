basePath: /api/v1
definitions:
  github_com_irfan-ghzl_pintour-travel_internal_domain_package.Package:
    properties:
      base_price:
        type: number
      category:
        description: default reguler
        enum:
        - reguler
        - umroh
        - halal
        - honeymoon
        type: string
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      destination:
        type: string
      duration_days:
        maximum: 365
        minimum: 1
        type: integer
      facilities:
        description: FR-CAT-03
        items:
          type: integer
        type: array
      id:
        type: string
      is_active:
        type: boolean
      itinerary:
        description: '[]ItineraryDay'
        items:
          type: integer
        type: array
      name:
        type: string
      requirements:
        description: '[]string'
        items:
          type: integer
        type: array
      slug:
        type: string
      terms_conditions:
        type: string
      thumbnail:
        type: string
      updated_at:
        type: string
      visa_info:
        type: string
    required:
    - base_price
    - destination
    - duration_days
    - name
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API untuk sistem E-Catalog Tour & Travel dengan WhatsApp Gateway
  title: Pintour E-Catalog API
  version: "2.0"
paths:
  /admin/airport/checklist:
    get:
      parameters:
      - description: Batch ID
        in: query
        name: batch_id
        required: true
        type: string
      - description: Filter status (pending/done)
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Daftar checklist airport per batch
      tags:
      - airport
  /admin/airport/checklist/init:
    post:
      consumes:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Siapkan baris checklist untuk seluruh peserta batch
      tags:
      - airport
  /admin/airport/confirm-departure:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Kirim WA konfirmasi keberangkatan ke semua peserta batch (FR-AUTO-08)
      tags:
      - airport
  /admin/airport/participants/{participant_id}/baggage:
    patch:
      parameters:
      - description: Participant ID
        in: path
        name: participant_id
        required: true
        type: string
      - description: Batch ID
        in: query
        name: batch_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tandai bagasi peserta sudah dicheck (FR-AIR-02)
      tags:
      - airport
  /admin/airport/participants/{participant_id}/passport:
    patch:
      parameters:
      - description: Participant ID
        in: path
        name: participant_id
        required: true
        type: string
      - description: Batch ID
        in: query
        name: batch_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tandai paspor peserta sudah dikembalikan (FR-AIR-02/03)
      tags:
      - airport
  /admin/airport/participants/{participant_id}/ticket:
    patch:
      parameters:
      - description: Participant ID
        in: path
        name: participant_id
        required: true
        type: string
      - description: Batch ID
        in: query
        name: batch_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tandai tiket peserta sudah didistribusikan (FR-AIR-02)
      tags:
      - airport
  /admin/airport/report/pdf:
    get:
      parameters:
      - description: Batch ID
        in: query
        name: batch_id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Laporan post-handling sebagai PDF (FR-AIR-06)
      tags:
      - airport
  /admin/batches:
    get:
      description: Sumber data pemilih batch di halaman Peserta, Invoice, dan Airport
        Handling — tidak ada layar admin yang menuntut operator mengetahui UUID batch.
      parameters:
      - description: Hanya keberangkatan yang belum lewat
        in: query
        name: upcoming
        type: boolean
      - description: Status batch (tersedia/penuh/ditutup)
        in: query
        name: status
        type: string
      - description: Cocokkan nama paket
        in: query
        name: search
        type: string
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 20
        description: Per halaman
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Daftar keberangkatan lintas paket (admin)
      tags:
      - admin-packages
  /admin/chatbot-logs:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: Daftar percakapan chatbot per nomor (admin)
      tags:
      - chatbot
  /admin/chatbot-logs/{phone}:
    get:
