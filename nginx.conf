# Nginx adalah satu-satunya pintu ke stack (PRD §24). Service lain hanya
# `expose`, jadi apa pun yang tidak lewat sini tidak punya jalan masuk.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Versi nginx tidak perlu diumumkan di setiap respons dan halaman galat.
    server_tokens off;

    # Batas ukuran unggahan.
    #
    # Bawaan nginx adalah 1 MB, sementara API menerima multipart sampai 12 MB
    # untuk dokumen peserta. Selisih itu berarti setiap paspor hasil pindai —
    # yang lazimnya 2–5 MB — ditolak di sini, dengan halaman HTML 413 milik
    # nginx alih-alih pesan JSON milik aplikasi. Angkanya sengaja sedikit di
    # atas 12 MB supaya batas aplikasi yang lebih dulu bicara, lengkap dengan
    # pesan yang bisa dibaca klien.
    client_max_body_size 13m;
    client_body_timeout  60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Header keamanan dasar. HSTS sengaja tidak dipasang di sini: berkas ini
    # melayani HTTP polos di belakang terminator TLS, dan HSTS adalah janji yang
    # hanya boleh dibuat oleh yang benar-benar memegang sertifikatnya.
    #
    # Ketiganya diulang di setiap location yang punya add_header sendiri, dan
    # pengulangan itu wajib, bukan gaya penulisan: add_header di blok anak
    # MENGGANTI seluruh add_header warisan, bukan menambahinya. Versi pertama
    # berkas ini hanya menaruhnya di sini, dan akibatnya justru terbalik dari
    # yang dimaksud — /api/ (tanpa add_header sendiri) mendapat ketiganya,
    # sementara index.html dan seluruh aset, satu-satunya hal yang benar-benar
    # dirender peramban, tidak mendapat satu pun.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ── API ───────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Beberapa endpoint memang lambat karena memang bekerja: PDF invoice dan
        # laporan bandara dirender saat diminta, dan OCR menunggu sidecar
        # Tesseract. Bawaan 60 detik memutus sebagian di antaranya.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Balasan diteruskan apa adanya, bukan ditahan sampai lengkap — unduhan
        # PDF mulai mengalir ke klien begitu byte pertama siap.
        proxy_buffering off;
    }

    # ── Swagger ───────────────────────────────────────────────────────────────
    # Terbuka karena PRD §20 menjadikannya dokumentasi API proyek ini. Perlu
    # dicatat konsekuensinya: seluruh permukaan endpoint terbaca siapa pun.
    # Menutupnya di produksi cukup dengan mengomentari blok ini — otorisasi
    # tiap endpoint tidak bergantung padanya.
    location /swagger/ {
        proxy_pass       http://api:8080;
        proxy_set_header Host $host;
    }

    # ── Aset statis ───────────────────────────────────────────────────────────
    # Vite menyisipkan hash isi ke nama berkas, jadi aset yang berubah datang
    # dengan nama baru dan cache satu tahun tidak akan pernah basi.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # ── SPA ───────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html tidak boleh di-cache. Namanya tidak ber-hash dan ia yang memuat
    # nama seluruh aset lain; satu salinan basi di peramban berarti pengguna
    # memuat aplikasi versi lama sampai cache-nya kedaluwarsa sendiri.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }
}
